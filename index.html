<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Shopping Voice Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
    }

    h1 {
      font-size: 32px;
    }

    #micButton {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: none;
      font-size: 70px;
      margin-top: 30px;
      cursor: pointer;
    }

    #status {
      font-size: 22px;
      margin-top: 30px;
    }

    #heard {
      font-size: 26px;
      margin-top: 20px;
      font-weight: bold;
    }

    #result {
      font-size: 24px;
      margin-top: 25px;
      font-weight: bold;
    }
  </style>
</head>


<body>

  <h1>Shopping Voice</h1>

  <p>Tap the microphone and speak.</p>

  <button
    id="micButton"
    onclick="startListening()"
  >
    🎤
  </button>

  <div id="status">
    Ready
  </div>

  <div id="heard"></div>

  <div id="result"></div>
<div id="shoppingSection">

  <h2>To Buy</h2>

  <div id="shoppingList">
    Loading...
  </div>

</div>

  <script>

    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbxh83hFWKIbgYIbOaDhqQy9jP6AFeRVZ8K_rkqkZJl6pCWALtV84XZqfPAoTn379xBf/exec";


    function startListening() {

      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

      if (!SpeechRecognition) {

        document
          .getElementById("status")
          .innerText =
            "Speech recognition is not supported by this browser.";

        return;
      }


      const recognition =
        new SpeechRecognition();

      recognition.lang = "en-AU";

      recognition.interimResults = false;

      recognition.maxAlternatives = 1;


      recognition.onstart =
        function() {

          document
            .getElementById("status")
            .innerText =
              "Listening...";

          document
            .getElementById("heard")
            .innerText =
              "";

          document
            .getElementById("result")
            .innerText =
              "";
        };


      recognition.onresult =
        function(event) {

          const text =
            event.results[0][0].transcript;

          document
            .getElementById("heard")
            .innerText =
              text;

          document
            .getElementById("status")
            .innerText =
              "Heard:";

          sendCommand(text);
        };


      recognition.onerror =
        function(event) {

          document
            .getElementById("status")
            .innerText =
              "Error: " + event.error;
        };


      recognition.onend =
        function() {

          if (
            document
              .getElementById("status")
              .innerText ===
            "Listening..."
          ) {

            document
              .getElementById("status")
              .innerText =
                "Ready";
          }
        };


      recognition.start();
    }


    // --------------------------------------------------
    // Send recognised speech to Google Apps Script
    // --------------------------------------------------

function sendCommand(command) {

  document
    .getElementById("result")
    .innerText =
      "Updating shopping list...";

  const callbackName =
    "shoppingCallback_" +
    Date.now();

  window[callbackName] =
    function(data) {

      document
        .getElementById("result")
        .innerText =
          data.result ||
          "Done";

      delete window[callbackName];

      script.remove();
      loadShoppingList();
    };


  const script =
    document.createElement("script");


  script.src =
    SCRIPT_URL +
    "?command=" +
    encodeURIComponent(command) +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      document
        .getElementById("result")
        .innerText =
          "Could not update shopping list";

      delete window[callbackName];

      script.remove();
    };


  document
    .body
    .appendChild(script);
}
function loadShoppingList() {

  const callbackName =
    "listCallback_" +
    Date.now();

  window[callbackName] =
    function(data) {

      const list =
        document.getElementById(
          "shoppingList"
        );

      list.innerHTML = "";

      if (
        !data.items ||
        data.items.length === 0
      ) {
        list.innerText =
          "Nothing to buy";
      } else {

        for (const item of data.items) {

  const row =
    document.createElement("div");

  const checkbox =
    document.createElement("input");

  checkbox.type = "checkbox";

  checkbox.onchange =
    function() {

      if (checkbox.checked) {
        completeItem(item);
      }
    };

  const label =
    document.createElement("span");

  label.innerText = item;

  row.appendChild(checkbox);
  row.appendChild(label);

  list.appendChild(row);
}
      }

      delete window[callbackName];

      script.remove();
    };


  const script =
    document.createElement("script");

  script.src =
    SCRIPT_URL +
    "?action=getList" +
    "&callback=" +
    callbackName;

  script.onerror =
    function() {

      document
        .getElementById("shoppingList")
        .innerText =
          "Could not load shopping list";

      delete window[callbackName];

      script.remove();
    };

  document
    .body
    .appendChild(script);
}
function completeItem(item) {

  const callbackName =
    "completeCallback_" +
    Date.now();

  window[callbackName] =
    function(data) {

      delete window[callbackName];

      script.remove();

      if (data.success) {
        loadShoppingList();
      }
    };


  const script =
    document.createElement("script");

  script.src =
    SCRIPT_URL +
    "?action=complete" +
    "&item=" +
    encodeURIComponent(item) +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      document
        .getElementById("result")
        .innerText =
          "Could not update item";

      delete window[callbackName];

      script.remove();

      loadShoppingList();
    };


  document
    .body
    .appendChild(script);
}

window.addEventListener(
  "load",
  loadShoppingList
);

  </script>

</body>

</html>
